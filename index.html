<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08030f">
  <title>ClipShortener</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08030f;color:#fbf8ff;font:16px system-ui,sans-serif}
    main{max-width:560px;margin:24px;padding:24px;border:1px solid #493067;border-radius:18px;background:#120a21}
    p{color:#cbbbd9;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <h1>Loading ClipShortener…</h1>
    <p>Preparing the updated upload page. Keep this tab open.</p>
  </main>
  <script>
  (async () => {
    const SOURCE_URL = 'https://cdn.jsdelivr.net/gh/Momore-glitch/clipshortener@2fa4f5f6ca17c97223b449de4ea4a597126e1965/index.html';
    const response = await fetch(SOURCE_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error(`Could not load the current ClipShortener page (HTTP ${response.status}).`);

    let html = await response.text();
    const replacements = [
      [
        "function baseHeaders(f){const total=Math.max(1,Math.ceil(f.size/UPLOAD_CHUNK_SIZE));return{'X-Upload-Name':f.name,'X-Upload-Total':String(f.size),'X-Upload-Chunks':String(total),'X-Upload-Chunk-Size':String(UPLOAD_CHUNK_SIZE),",
        "function baseHeaders(f,chunkSize=UPLOAD_CHUNK_SIZE){const total=Math.max(1,Math.ceil(f.size/chunkSize));return{'X-Upload-Name':f.name,'X-Upload-Total':String(f.size),'X-Upload-Chunks':String(total),'X-Upload-Chunk-Size':String(chunkSize),"
      ],
      [
        "  const chunkSize=UPLOAD_CHUNK_SIZE;\n  const totalChunks=Math.ceil(file.size/chunkSize);",
        "  // B2 multipart uploads need at least two parts; non-final parts must be >=5 MiB.\n  // Use 5 MiB chunks for videos between 5 and 16 MiB so they form two valid parts.\n  const B2_MIN_PART_SIZE=5*1024*1024;\n  const chunkSize=(file.size>B2_MIN_PART_SIZE&&file.size<UPLOAD_CHUNK_SIZE)\n    ?B2_MIN_PART_SIZE:UPLOAD_CHUNK_SIZE;\n  const totalChunks=Math.ceil(file.size/chunkSize);"
      ],
      [
        "...baseHeaders(file),'X-Upload-Name':workerFilename",
        "...baseHeaders(file,chunkSize),'X-Upload-Name':workerFilename"
      ]
    ];

    for (const [before, after] of replacements) {
      if (!html.includes(before)) throw new Error('The source page did not match the expected version. No page changes were applied.');
      html = html.replace(before, after);
    }

    if (!html.includes('B2_MIN_PART_SIZE') || !html.includes('baseHeaders(file,chunkSize)')) {
      throw new Error('The upload fix could not be verified.');
    }

    document.open();
    document.write(html);
    document.close();
  })().catch(error => {
    document.body.innerHTML = '';
    const main = document.createElement('main');
    main.style.cssText = 'max-width:560px;margin:40px auto;padding:24px;background:#260d18;color:#ffbeca;border:1px solid #713044;border-radius:16px;font:16px system-ui';
    const heading = document.createElement('h1');
    heading.textContent = 'ClipShortener could not load';
    const message = document.createElement('p');
    message.textContent = error && error.message ? error.message : 'Unknown loading error.';
    main.append(heading, message);
    document.body.append(main);
  });
  </script>
</body>
</html>
